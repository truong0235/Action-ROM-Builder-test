name: Build AOSP GSI


on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      AOSP_BRANCH:
        description: 'AOSP manifest branch'
        required: true
        default: 'android-11.0.0_r48'
      ANDROID_VERSION:
        description: 'Android version for treble manifests'
        required: true
        default: 'android-11.0'
      CUSTOM_BUILD:
        description: 'GSI variant (e.g. arm64-ab-vanilla-nosu)'
        required: true
        default: 'arm64-ab-vanilla-nosu'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AOSP_BRANCH: ${{ inputs.AOSP_BRANCH || 'android-11.0.0_r48' }}
      ANDROID_VERSION: ${{ inputs.ANDROID_VERSION || 'android-11.0' }}
      CUSTOM_BUILD: ${{ inputs.CUSTOM_BUILD || 'arm64-ab-vanilla-nosu' }}
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo rm -rf /opt/hostedtoolcache || true
        sudo docker system prune -af || true
        df -h

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install dependencies
      run: |
        sudo apt install -y git aria2 \
          bc bison flex gperf lib32z1-dev libc6-dev-i386 \
          libxml2-utils xsltproc fontconfig liblz4-tool lzop \
          squashfs-tools schedtool libreadline-dev lib32readline-dev \
          pngcrush imagemagick python3-all-dev

        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

        sudo curl --create-dirs -L -o /usr/local/bin/repo \
          https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 2

    - name: Repo init AOSP
      run: |
        repo init -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Add treble manifest
      run: |
        git clone https://github.com/TrebleDroid/treble_manifest \
          .repo/local_manifests \
          -b ${{ env.ANDROID_VERSION }}
        rm -f .repo/local_manifests/replace.xml
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Download and extract treble patches
      run: |
        wget -q https://github.com/TrebleDroid/treble_experimentations/releases/latest/download/patches-for-developers.zip
        mkdir -p patches && unzip -o patches-for-developers.zip -d patches
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync source
      run: |
        SYNC_START=$(date +%s)
        repo sync -c --no-tags --no-clone-bundle \
          --force-sync -j$(nproc)
        SYNC_END=$(date +%s)
        SYNC_ELAPSED=$(( SYNC_END - SYNC_START ))
        echo "Sync time: $(( SYNC_ELAPSED / 3600 ))h $(( SYNC_ELAPSED % 3600 / 60 ))m $(( SYNC_ELAPSED % 60 ))s"
        echo "=== Disk after sync ==="
        df -h /home/runner/work
        echo "=== Source size ==="
        du -sh .
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Apply patches
      run: |
        find patches -name "*.patch" -type f | sort | while read patch; do
          project_name=$(echo "$patch" | sed 's|^patches/||; s|/[^/]*$||')
          project_dir=$(echo "$project_name" | sed 's|^platform_||; s|_|/|g')
          if [ -d "$project_dir" ]; then
            echo "Applying to $project_dir"
            (cd "$project_dir" && git am "$GITHUB_WORKSPACE/$patch")
          else
            echo "Skip $project_dir (not found)"
          fi
        done
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk after sync
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        du -sh .repo/
        rm -rf .repo
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Generate device config
      run: |
        cd device/phh/treble
        bash generate.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check resources before build
      run: |
        echo "=== Memory ==="
        free -h
        echo "=== Disk ==="
        df -h /home/runner/work
        echo "=== CPU ==="
        nproc
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Build system image
      run: |
        # Start background monitor: logs every 60s
        (
          while true; do
            echo "$(date +%H:%M:%S) | MEM: $(free -h | awk '/Mem/{print $3"/"$2}') | SWAP: $(free -h | awk '/Swap/{print $3"/"$2}') | DISK: $(df -h /home/runner/work | awk 'NR==2{print $3"/"$2}') | PROCS: $(ps aux | grep -E 'ninja|clang|java' | grep -v grep | wc -l)"
            sleep 60
          done
        ) > /tmp/monitor.log 2>&1 &
        MONITOR_PID=$!

        . build/envsetup.sh
        lunch treble_arm64_bvN-userdebug

        BUILD_START=$(date +%s)
        echo "::group::Build started at $(date)"
        make WITHOUT_CHECK_API=true -j$(nproc) systemimage 2>&1 | tee /tmp/build.log
        BUILD_EXIT=$?
        BUILD_END=$(date +%s)
        BUILD_ELAPSED=$(( BUILD_END - BUILD_START ))

        kill $MONITOR_PID 2>/dev/null || true

        echo "::endgroup::"
        echo "Build exit code: $BUILD_EXIT"
        echo "Build time: $(( BUILD_ELAPSED / 3600 ))h $(( BUILD_ELAPSED % 3600 / 60 ))m $(( BUILD_ELAPSED % 60 ))s"
        echo "::group::Resource usage during build"
        cat /tmp/monitor.log
        echo "::endgroup::"
        echo "::group::Last 50 lines of build log"
        tail -50 /tmp/build.log
        echo "::endgroup::"

        exit $BUILD_EXIT
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk and compress
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        echo "=== Cleaning symbols and host tools ==="
        rm -rf out/target/product/*/symbols
        rm -rf out/host
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work
        echo "=== Compressing system image ==="
        xz -9 -T0 -v -z out/target/product/phh_treble/system.img
        echo "=== Final disk usage ==="
        df -h /home/runner/work
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/phh_treble/system.img.xz
        name: AOSP-GSI-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          # ROM: AOSP GSI
          # Variant: ${{ env.CUSTOM_BUILD }}
          # AOSP Branch: ${{ env.AOSP_BRANCH }}
          # Target: arm64 A/B
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
